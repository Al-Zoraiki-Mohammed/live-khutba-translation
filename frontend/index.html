<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Translation • Live Khutba </title>
    <style>
        :root {
            --bg-color: #070a11;
            --card-bg: rgba(18, 26, 43, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-gold: #fbbf24;
            --accent-blue: #3b82f6;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 40px 60px;
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .branding {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .mosque-title {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-primary);
        }

        .tag {
            background: rgba(251, 191, 36, 0.1);
            color: var(--accent-gold);
            border: 1px solid rgba(251, 191, 36, 0.3);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        #status {
            font-size: 0.95rem;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444;
        }

        /* Main Scrolling Feed */
        #transcript-container {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding-right: 15px;
            scroll-behavior: smooth;
        }

        #transcript-container::-webkit-scrollbar {
            width: 6px;
        }
        #transcript-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        /* Sentence Card Design */
        .translation-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-left: 6px solid var(--accent-blue);
            padding: 28px 36px;
            border-radius: 0 16px 16px 0;
            font-size: 2.3rem;
            line-height: 1.5;
            font-weight: 400;
            color: var(--text-primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            transition: opacity 0.5s ease, border-left-color 0.5s ease;
            word-wrap: break-word;
        }

        /* Active highlight on the latest card being written */
        .translation-card.active {
            border-left-color: var(--accent-gold);
            background: rgba(24, 34, 56, 0.95);
        }

        .translation-card.previous {
            opacity: 0.7;
            border-left-color: var(--border-color);
        }

        /* Word reveal animation */
        .word {
            display: inline-block;
            opacity: 0;
            transform: translateY(4px);
            animation: popIn 0.2s ease-out forwards;
            margin-right: 0.3em;
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Typing Cursor Effect */
        .cursor {
            display: inline-block;
            width: 3px;
            height: 1em;
            background-color: var(--accent-gold);
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

        <div class="branding">
            <div class="mosque-title">AI Translation</div>
            <div class="tag">Live Khutba</div>
        </div>
        <div id="status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">Connecting...</span>
        </div>
    </header>

    <div id="transcript-container">
        <div class="translation-card" style="color: var(--text-secondary); font-size: 1.6rem; border-left-color: var(--border-color);">
            Waiting for the Khutba to begin...
        </div>
    </div>

    <script>
        const container = document.getElementById("transcript-container");
        const statusText = document.getElementById("status-text");
        const statusDot = document.getElementById("status-dot");

        function typeSentence(text) {
            // Remove initial placeholder if present
            if (container.children.length === 1 && container.children[0].innerText.includes("Waiting for")) {
                container.innerHTML = "";
            }

            // Dim previous cards
            const previousCards = container.querySelectorAll(".translation-card");
            previousCards.forEach(card => {
                card.classList.remove("active");
                card.classList.add("previous");
            });

            // Create new card
            const card = document.createElement("div");
            card.className = "translation-card active";
            
            const cursor = document.createElement("span");
            cursor.className = "cursor";
            
            card.appendChild(cursor);
            container.appendChild(card);

            // Split into words
            const words = text.split(" ");
            let index = 0;

            function revealNextWord() {
                if (index < words.length) {
                    const wordSpan = document.createElement("span");
                    wordSpan.className = "word";
                    wordSpan.textContent = words[index] + " ";

                    card.insertBefore(wordSpan, cursor);
                    index++;

                    // Keep view scrolled to bottom as words appear
                    container.scrollTop = container.scrollHeight;

                    // Adjust delay per word length for natural cadence (40ms - 80ms)
                    const delay = Math.min(Math.max(words[index - 1].length * 12, 45), 85);
                    setTimeout(revealNextWord, delay);
                } else {
                    // Remove cursor when sentence finishes typing
                    cursor.remove();
                }
            }

            revealNextWord();
        }

        function connectWebSocket() {
            const ws = new WebSocket("ws://localhost:8765");

            ws.onopen = function() {
                statusText.textContent = "Live Stream Active";
                statusDot.style.backgroundColor = "#10b981";
            };

            ws.onmessage = function(event) {
                if (event.data && event.data.trim().length > 0) {
                    typeSentence(event.data);
                }
            };

            ws.onclose = function() {
                statusText.textContent = "Reconnecting...";
                statusDot.style.backgroundColor = "#f59e0b";
                setTimeout(connectWebSocket, 3000);
            };
        }

        connectWebSocket();
    </script>
</body>
</html>
